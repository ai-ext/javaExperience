# 1단계 출발 compose: 내 프로젝트 루트에 복사해서 쓴다(course/start/README.md 참고).
# 포트·계정은 구현 예시 서버(board-server)와 같다. 그래야 순서 칸의 구현 예시 설정을 그대로 붙여도 연결된다.
# 그래서 board-server의 compose와 동시에 띄우지 않는다.
services:
  # D01-2부터. 서버는 localhost:13310의 board DB에 board 계정으로 붙는다.
  mysql:
    image: mysql:8.4
    ports:
      - "13310:3306"
    environment:
      MYSQL_DATABASE: board
      MYSQL_USER: board
      MYSQL_PASSWORD: ${DB_PASSWORD:-board}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      retries: 20

  # D09부터. 인기글 캐시·쿠폰 수량·랭킹·로그인 제한. 서버는 localhost:16379로 붙는다.
  redis:
    image: redis:7.4
    ports:
      - "16379:6379"

  # D08부터. 외부 PG 모의(명세 7절). 스텁은 테스트와 같은 src/test/resources/wiremock을 쓴다.
  # 금액 999000은 항상 거절한다(pg-approve-declined.json).
  wiremock:
    image: wiremock/wiremock:3.13.1
    ports:
      - "18080:8080"
    volumes:
      - ./src/test/resources/wiremock:/home/wiremock:ro

  # D08부터. 서버는 Toxiproxy(18666)를 거쳐 WireMock을 부른다. 지연 주입 예:
  # curl -X POST localhost:8474/proxies/pg/toxics -d '{"type":"latency","attributes":{"latency":5000}}'
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    command: ["-host=0.0.0.0", "-config=/config/toxiproxy.json"]
    ports:
      - "8474:8474"
      - "18666:8666"
    volumes:
      - ./toxiproxy.json:/config/toxiproxy.json:ro
    depends_on:
      - wiremock
