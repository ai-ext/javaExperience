  <title id="title">10-5 게시글 작성 — JPA, 검증 규칙·태그·작성자는 토큰 주인 화면 시안</title><desc id="desc">제목·본문·태그·공개 범위를 넣고 저장한다. 작성자는 화면이 보내지 않는다 — 서버가 토큰에서 꺼낸다.</desc>
