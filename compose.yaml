# 로컬 개발용 DB와 DB 관리 화면 — 실행: docker compose up -d
#
#   mysql       MySQL 8.4 · localhost:13308 · 계정 community / community
#               community DB : 시나리오(따라 만들기)용 — 앱 기본 연결
#               practice  DB : 학습용 더미 데이터 — practice 프로파일(practice/MISSIONS.md)
#               project   DB : 10장 별도 명세서 프로젝트 — project 프로파일
#   cloudbeaver 웹 DBeaver · http://localhost:8978 · 로그인 cbadmin / Admin1234
#               세 DB 연결이 미리 들어 있어 누르기만 하면 접속된다
#
# 초기 데이터는 docker/mysql/init/ 의 dump 파일, CloudBeaver 연결은 docker/cloudbeaver/data-sources.json 이다(둘 다 읽기 전용 마운트).
# 처음 만들 때 한 번 적용되고, 그 뒤 데이터는 mysql-data·cloudbeaver-data 볼륨에 남는다.
#   처음 상태로 되돌리기: docker compose down -v && docker compose up -d
#   지금 상태를 떠 두기  : ./docker/mysql/dump.sh   (docker/mysql/backup/ 에 저장)
# 포트가 겹치면: DB_PORT=13318 CB_PORT=8989 docker compose up -d (DB 포트를 바꾸면 application.yml도 같이 바꾼다)
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: community
      MYSQL_USER: community
      MYSQL_PASSWORD: community
      MYSQL_ROOT_PASSWORD: root
      TZ: Asia/Seoul
    ports:
      - "${DB_PORT:-13308}:3306"
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  cloudbeaver:
    image: dbeaver/cloudbeaver:24.3.1
    environment:
      # 처음 실행 때 나오는 설정 화면을 건너뛰고 관리자 계정을 바로 만든다
      # 아이디 admin은 CloudBeaver의 기본 팀 이름과 겹쳐서 못 쓴다 → cbadmin. 비밀번호는 규칙(8자 이상·대소문자·숫자) 때문에 Admin1234
      CB_SERVER_NAME: javaExperience
      CB_SERVER_URL: http://localhost:${CB_PORT:-8978}
      CB_ADMIN_NAME: cbadmin
      CB_ADMIN_PASSWORD: Admin1234
      # 익명 접속을 끄면 열자마자 로그인 화면이 나온다(켜 두면 연결이 안 보이는 빈 화면이 먼저 뜬다)
      CLOUDBEAVER_APP_ANONYMOUS_ACCESS_ENABLED: "false"
    ports:
      - "${CB_PORT:-8978}:8978"
    volumes:
      - cloudbeaver-data:/opt/cloudbeaver/workspace
      - ./docker/cloudbeaver:/config:ro
    # 처음 뜰 때 미리 만든 연결을 작업 공간에 넣고 원래 서버를 띄운다(docker/cloudbeaver/start.sh)
    entrypoint: ["/bin/sh", "/config/start.sh"]
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
  cloudbeaver-data:
