# 실습용 MySQL 8.4 — 실행: docker compose up -d --build
#   community DB : 시나리오(따라 만들기)용 — 앱 기본 연결
#   practice  DB : 학습용 더미 데이터 — practice 프로파일(practice/MISSIONS.md)
# 처음 뜰 때만 docker/mysql/sql 의 스크립트가 실행된다.
# 데이터를 처음 상태로 되돌리기: docker compose down -v && docker compose up -d --build
# 포트가 겹치면: DB_PORT=13318 docker compose up -d (application.yml의 포트도 같이 바꾼다)
services:
  mysql:
    build: docker/mysql
    image: java-experience-db:local
    environment:
      MYSQL_DATABASE: community
      MYSQL_USER: community
      MYSQL_PASSWORD: community
      MYSQL_ROOT_PASSWORD: root
      TZ: Asia/Seoul
    ports:
      - "${DB_PORT:-13308}:3306"
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  mysql-data:
