# 로컬 개발용: compose.yaml의 MySQL(13310)에 붙는다. 환경 변수가 있으면 환경 변수가 이긴다.
server:
  port: 8080
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:13310/board}
    username: ${DB_USERNAME:board}
    password: ${DB_PASSWORD:board}
  sql:
    init:
      # 시드는 local 프로파일에서만 넣는다
      data-locations: classpath:data-local.sql
board:
  jwt:
    secret: ${BOARD_JWT_SECRET:local-dev-only-secret-local-dev-only-secret}
