spring:
  application:
    name: board-server
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  sql:
    init:
      # MySQL 같은 외부 DB는 always가 아니면 schema.sql을 실행하지 않는다
      mode: always

board:
  forbidden-words:
    ignore-case: true
  jwt:
    expires-in-seconds: 3600

management:
  endpoints:
    web:
      exposure:
        # HTTP로는 health만 노출한다 (env 등은 비밀값이 드러난다)
        include: health

---
spring:
  config:
    activate:
      on-profile: test
  jpa:
    properties:
      # 테스트에서 SQL 실행 횟수(N+1)를 세기 위해서만 켠다
      hibernate.generate_statistics: true
  datasource:
    hikari:
      maximum-pool-size: 5
board:
  jwt:
    secret: ${BOARD_JWT_SECRET:test-only-secret-test-only-secret-0123}
