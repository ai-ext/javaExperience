spring:
  application:
    name: board-server
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:13310/board}
    username: ${DB_USERNAME:board}
    password: ${DB_PASSWORD:board}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  sql:
    init:
      # MySQL 같은 외부 DB는 always가 아니면 schema.sql을 실행하지 않는다
      mode: always

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    hikari:
      maximum-pool-size: 5
