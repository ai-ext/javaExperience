spring:
  application:
    name: board-server
  datasource:
    hikari:
      # spec-v2 §8 운영 값. 풀이 바닥나면 2초 안에 실패시켜 요청 스레드가 끝없이 기다리지 않게 한다.
      maximum-pool-size: 10
      connection-timeout: 2000
  data:
    redis:
      # compose의 Redis(16379). 운영은 환경 변수로 덮는다.
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:16379}
      # spec-v2 §8 운영 값. Redis가 느려도 요청이 500ms 넘게 묶이지 않게 한다(연결 기본값 10초도 줄인다).
      timeout: 500ms
      connect-timeout: 500ms
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  sql:
    init:
      # MySQL 같은 외부 DB는 always가 아니면 schema.sql을 실행하지 않는다
      mode: always

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

board:
  forbidden-words:
    ignore-case: true
  jwt:
    expires-in-seconds: 3600
  pg:
    # compose의 Toxiproxy(→ WireMock). 운영은 환경 변수로 덮는다.
    base-url: ${BOARD_PG_BASE_URL:http://localhost:18666}
    # spec-v2 §8 운영 값
    connect-timeout: 1s
    response-timeout: 3s
    connection-request-timeout: 2s
    max-connections: 20

management:
  endpoints:
    web:
      exposure:
        # HTTP로는 health만 노출한다 (env 등은 비밀값이 드러난다)
        include: health
  health:
    redis:
      # Redis는 캐시·거름망이라 없어도 DB로 폴백해 동작한다. 켜 두면 Redis 장애만으로 헬스가 503이 되어
      # 로드밸런서가 멀쩡한 서버까지 빼 버린다. Redis 상태는 헬스가 아니라 경고 로그·지표로 본다.
      enabled: false

---
spring:
  config:
    activate:
      on-profile: test
  jpa:
    properties:
      # 테스트에서 SQL 실행 횟수(N+1)를 세기 위해서만 켠다
      hibernate.generate_statistics: true
board:
  jwt:
    secret: ${BOARD_JWT_SECRET:test-only-secret-test-only-secret-0123}
  pg:
    secret: ${BOARD_PG_SECRET:test-only-pg-secret-test-only-pg-secret}
