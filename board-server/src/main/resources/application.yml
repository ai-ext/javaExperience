spring:
  application:
    name: board-server
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  sql:
    init:
      # MySQL 같은 외부 DB는 always가 아니면 schema.sql을 실행하지 않는다
      mode: always

management:
  endpoints:
    web:
      exposure:
        # HTTP로는 health만 노출한다 (env 등은 비밀값이 드러난다)
        include: health

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    hikari:
      maximum-pool-size: 5
