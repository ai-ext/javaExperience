# 테스트 전용 설정 — build.gradle의 test 태스크가 test 프로파일을 켠다.
# compose DB 대신 Testcontainers가 띄운 일회용 MySQL 8.4를 쓴다(Docker가 켜져 있어야 한다).
# 시나리오용(community) dump를 매번 새로 적재하므로 테스트가 compose DB의 데이터를 바꾸지 않는다.
spring:
  datasource:
    url: jdbc:tc:mysql:8.4:///community
  sql:
    init:
      mode: always
      encoding: UTF-8
      # dump 하나에 테이블과 데이터가 함께 있다
      schema-locations: file:docker/mysql/init/01-community.sql
