# MySQL 연결 설정 (H2 대신 사용할 때 주석 해제)
spring:
 datasource:
   url: jdbc:mysql://localhost:3306/community?characterEncoding=UTF-8&serverTimezone=Asia/Seoul
   username: community
   password: community
 jpa:
   hibernate:
     ddl-auto: update

logging:
  level:
    # 실행되는 SQL과 바인딩 값 — 쿼리가 몇 번 나가는지(N+1) 볼 때 쓴다
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace

