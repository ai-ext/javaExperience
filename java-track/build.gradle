// Java 트랙(J00~J15) 학습 테스트 모듈. Spring·Lombok 없이 순수 Java + JUnit 5 + AssertJ만 쓴다.
//
// 소스 세트
//   main   (src/main/java)   학습자 뼈대. 시그니처만 있고 본문은 UnsupportedOperationException("JNN: …")
//   answer (src/answer/java) 정답. 학습자가 채우는 클래스만 둔다(같은 패키지·클래스·시그니처)
//   test   (src/test/java)   학습 테스트. main 기준으로 한 번만 컴파일하고 두 소스 세트가 같이 쓴다
//   answerTest (src/answerTest/java) 학습자가 테스트 자체를 채우는 날(J11)의 정답 테스트. src/test의 학습자 자리와
//                             같은 이름이라 answerTest 실행에서 classpath 맨 앞에 두면 학습자 자리를 가린다
//
// 태스크
//   :java-track:test           main 기준 실행. 뼈대면 실패한다(학습자가 통과시킬 대상). @Tag("optional") 선택 과제는 뺀다
//   :java-track:optionalTest   main 기준으로 @Tag("optional") 선택 과제만 실행한다(J02·J07·J14)
//   :java-track:answerTest     같은 테스트를 answer 클래스로 실행. 전부 통과해야 한다
//   :java-track:skeletonTest   main 기준 실행을 실패 무시로 돌려 결과 XML만 남긴다(verifySkeleton 입력)
//   :java-track:verifySkeleton src/test의 J 테스트 클래스가 모두 실행됐고, 클래스마다 뼈대 상태에서 진짜 실패가 1개 이상인지 확인
//   :java-track:check          answerTest + verifySkeleton (test는 넣지 않는다). 두 태스크 모두 선택 과제까지 실행한다

plugins {
    id 'java'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

sourceSets {
    answer {
        java.srcDir 'src/answer/java'
        // 정답 클래스가 주어진 클래스(뼈대 없이 main에만 있는 도메인 객체 등)를 참조할 수 있게 한다.
        // javac는 직접 컴파일하는 소스를 classpath의 같은 이름 클래스보다 먼저 쓰므로 정답 쪽 클래스가 이긴다.
        compileClasspath += sourceSets.main.output
    }
    // 정답 테스트. 학습 테스트와 같은 라이브러리로 main(주어진 레거시 코드)을 대상으로 컴파일한다.
    // answer 출력은 넣지 않는다: 정답 테스트도 학습 테스트처럼 main 시그니처만 보고 컴파일돼야 한다.
    answerTest {
        java.srcDir 'src/answerTest/java'
        compileClasspath += sourceSets.main.output + configurations.testCompileClasspath
    }
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.14.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.assertj:assertj-core:3.27.7'
    // Gradle 9부터 JUnit Platform 런처를 직접 넣어야 한다.
    // J11MutantTest가 특성화 테스트를 Launcher API로 다시 실행하므로 컴파일 classpath에도 둔다
    testImplementation 'org.junit.platform:junit-platform-launcher'
}

// java-track 태스크를 직접 고른 실행인지 설정 단계에서 한 번만 계산한다.
// 루트 `./gradlew test`·`build`는 학습자 레거시 앱용이라 여기의 뼈대 실패가 섞이면 안 된다.
def requestedTaskNames = gradle.startParameter.taskNames
def javaTrackRequested = requestedTaskNames.any { it.startsWith(':java-track') || it.startsWith('java-track:') } ||
        gradle.startParameter.currentDir.canonicalFile == projectDir.canonicalFile

// 루트에서 태스크 이름만으로 실행하면(예: `./gradlew test`) 이 모듈의 태스크는 모두 건너뛴다.
// test만 막으면 컴파일은 여전히 돌아서, 학습자가 J 코드를 고치다 컴파일이 깨지면 루트 test까지 깨진다.
tasks.configureEach {
    onlyIf('java-track 태스크를 직접 골랐을 때만 실행한다') { javaTrackRequested }
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'failed', 'skipped'
        exceptionFormat = 'full'
    }
}

// 기본 완료 조건(`:java-track:test --tests 'J14*'`)에는 선택 과제를 넣지 않는다.
tasks.named('test', Test) {
    useJUnitPlatform {
        excludeTags 'optional'
    }
}

// 선택 과제만 따로 돌린다. 예: `./gradlew :java-track:optionalTest --tests 'J14*'`
tasks.register('optionalTest', Test) {
    description = '학습자 상태(main) 기준으로 @Tag("optional") 선택 과제만 실행한다.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'optional'
    }
}

// answer 클래스를 main 클래스보다 앞에 둔다. 같은 이름의 클래스는 앞쪽이 로드되므로 정답이 뼈대를 가린다.
// 테스트 바이트코드는 main 시그니처로 컴파일됐으므로 정답 시그니처가 다르면 NoSuchMethodError로 드러난다.
// 정답 테스트(answerTest 소스 세트)는 그보다 더 앞에 둔다. 실행할 클래스 목록은 testClassesDirs(src/test)에서 정하고,
// 클래스는 이름으로 로드하므로 같은 이름의 학습자 자리(J11CharacterizationTest의 fail) 대신 정답 테스트가 돈다.
def answerTest = tasks.register('answerTest', Test) {
    description = '학습 테스트를 정답(answer) 클래스로 실행한다. 전부 통과해야 한다.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.answerTest.output + sourceSets.answer.output + sourceSets.test.runtimeClasspath
}

def skeletonResultsDir = layout.buildDirectory.dir('test-results/skeletonTest')

def skeletonTest = tasks.register('skeletonTest', Test) {
    description = '뼈대(main) 기준 학습 테스트를 실패 무시로 실행해 결과 XML을 남긴다.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    ignoreFailures = true
    reports.junitXml.outputLocation = skeletonResultsDir
    // 뼈대는 실패가 정상이므로 출력은 요약만 남긴다
    testLogging {
        events = []
        exceptionFormat = 'short'
    }
}

// 뼈대 실패로 인정하지 않는 실패: 클래스를 올리거나 초기화하다 깨진 것. 학습 메서드가 미구현이라 난 실패가 아니다
def notSkeletonFailureTypes = [
        'java.lang.ExceptionInInitializerError',
        'java.lang.NoClassDefFoundError',
        'java.lang.ClassNotFoundException',
        'java.lang.NoSuchMethodError',
        'java.lang.NoSuchFieldError',
        'java.lang.LinkageError',
        'java.lang.VerifyError',
] as Set
// JUnit이 클래스 단위 실패(@BeforeAll 등)를 보고할 때 쓰는 가짜 테스트 이름
def containerFailureNames = ['initializationError', 'classMethod', 'executionError'] as Set
def testSourceDir = file('src/test/java')

def verifySkeleton = tasks.register('verifySkeleton') {
    description = 'src/test의 J 테스트 클래스가 전부 뼈대 기준으로 실행됐고, 클래스마다 진짜 실패가 1개 이상인지 확인한다(뼈대가 실수로 정답이 되지 않게).'
    group = 'verification'
    dependsOn skeletonTest
    inputs.dir(testSourceDir)
    doLast {
        // 1) 필터를 건 skeletonTest 결과는 전체 검증이 아니다
        def skeletonTask = skeletonTest.get()
        def patterns = skeletonTask.filter.commandLineIncludePatterns + skeletonTask.filter.includePatterns
        if (!patterns.isEmpty()) {
            throw new GradleException("verifySkeleton: skeletonTest에 테스트 필터가 걸려 있습니다(${patterns.join(', ')}). 필터 없이 `:java-track:check`로 실행하세요.")
        }

        // 2) 기대 클래스 집합: src/test 안의 JNN…Test.java 파일 이름
        def expected = [] as SortedSet
        testSourceDir.eachFileRecurse(groovy.io.FileType.FILES) { file ->
            def m = file.name =~ /^(J\d\d\w*Test)\.java$/
            if (m.matches()) {
                expected << m.group(1)
            }
        }
        if (expected.isEmpty()) {
            throw new GradleException('verifySkeleton: src/test에 J로 시작하는 테스트 클래스가 없습니다.')
        }

        // 3) XML에서 클래스(최상위 이름)마다 실행·건너뜀·진짜 실패 수를 모은다
        def executed = [:].withDefault { 0 }
        def skipped = [:].withDefault { 0 }
        def realFailures = [:].withDefault { 0 }
        skeletonResultsDir.get().asFile.eachFileMatch(~/TEST-.*\.xml/) { file ->
            def suite = new groovy.xml.XmlSlurper().parse(file)
            def simpleName = suite.@name.toString().tokenize('.').last().tokenize('$').first()
            if (!(simpleName ==~ /J\d\d.*/)) {
                return
            }
            executed[simpleName] += suite.@tests.toInteger()
            skipped[simpleName] += suite.@skipped.toInteger()
            suite.testcase.each { testcase ->
                def caseName = testcase.@name.toString().replaceAll(/\(.*$/, '')
                def problems = testcase.failure.list() + testcase.error.list()
                def real = !containerFailureNames.contains(caseName) && problems.any { problem ->
                    !notSkeletonFailureTypes.contains(problem.@type.toString())
                }
                if (real) {
                    realFailures[simpleName] += 1
                }
            }
        }

        def problems = []
        def missing = expected - executed.keySet()
        if (!missing.isEmpty()) {
            problems << "결과가 없는 클래스(전체 실행이 아니거나 클래스가 올라가지 않음): ${missing.join(', ')}"
        }
        def unexpected = executed.keySet() - expected
        if (!unexpected.isEmpty()) {
            problems << "src/test에 없는 클래스의 결과(오래된 결과일 수 있음): ${unexpected.sort().join(', ')}"
        }
        def skippedClasses = expected.findAll { executed.containsKey(it) && skipped[it] > 0 }
        if (!skippedClasses.isEmpty()) {
            problems << "건너뛴 테스트가 있는 클래스: ${skippedClasses.join(', ')}"
        }
        def emptyClasses = expected.findAll { executed.containsKey(it) && executed[it] == skipped[it] }
        if (!emptyClasses.isEmpty()) {
            problems << "실행한 테스트가 없는 클래스: ${emptyClasses.join(', ')}"
        }
        def passedOnSkeleton = expected.findAll { executed.containsKey(it) && realFailures[it] == 0 }
        if (!passedOnSkeleton.isEmpty()) {
            problems << "뼈대 상태에서 진짜 실패가 하나도 없는 클래스(뼈대가 정답이 됐거나 초기화 오류뿐): ${passedOnSkeleton.join(', ')}"
        }
        if (!problems.isEmpty()) {
            throw new GradleException('verifySkeleton:\n  - ' + problems.join('\n  - '))
        }
        def totalFailures = realFailures.values().sum()
        logger.lifecycle("verifySkeleton: J 테스트 클래스 ${expected.size()}개(src/test 기준) 모두 실행됐고, 모두 뼈대 상태에서 실패함(진짜 실패 ${totalFailures}건)")
    }
}

// java 플러그인이 기본으로 거는 check → test 의존을 걷어 낸다(뼈대 상태의 test는 실패가 정상).
tasks.named('check') {
    setDependsOn([answerTest, verifySkeleton])
}
