// Java 트랙(J00~J15) 학습 테스트 모듈. Spring·Lombok 없이 순수 Java + JUnit 5 + AssertJ만 쓴다.
//
// 소스 세트
//   main   (src/main/java)   학습자 뼈대. 시그니처만 있고 본문은 UnsupportedOperationException("JNN: …")
//   answer (src/answer/java) 정답. 학습자가 채우는 클래스만 둔다(같은 패키지·클래스·시그니처)
//   test   (src/test/java)   학습 테스트. main 기준으로 한 번만 컴파일하고 두 소스 세트가 같이 쓴다
//   answerTest (src/answerTest/java) 학습자가 테스트 자체를 채우는 날(J11)의 정답 테스트. src/test의 학습자 자리와
//                             같은 이름이라 answerTest 실행에서 classpath 맨 앞에 두면 학습자 자리를 가린다
//
// 태스크
//   :java-track:test           main 기준 실행. 뼈대면 실패한다(학습자가 통과시킬 대상). @Tag("optional") 선택 과제는 뺀다
//   :java-track:optionalTest   main 기준으로 @Tag("optional") 선택 과제만 실행한다(J02·J07·J14·J15)
//   :java-track:answerTest     같은 테스트를 answer 클래스로 실행. 전부 통과해야 한다
//   :java-track:skeletonTest   main 기준 실행을 실패 무시로 돌려 결과 XML만 남긴다(verifySkeleton 입력)
//   :java-track:verifySkeleton answerTest(필터 없이 전부 통과)와 같은 개별 테스트가 뼈대 기준으로 모두 실행됐고, 실패는 전부
//                             의도한 뼈대 실패(UnsupportedOperationException("JNN: …") 또는 AssertionError 계열)이며
//                             클래스마다 1개 이상인지 확인. 두 태스크에 필터(--tests·exclude·태그 등)가 걸려 있으면 거부한다
//   :java-track:check          answerTest → skeletonTest → verifySkeleton (test는 넣지 않는다). 선택 과제까지 실행한다

plugins {
    id 'java'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

sourceSets {
    answer {
        java.srcDir 'src/answer/java'
        // 정답 클래스가 주어진 클래스(뼈대 없이 main에만 있는 도메인 객체 등)를 참조할 수 있게 한다.
        // javac는 직접 컴파일하는 소스를 classpath의 같은 이름 클래스보다 먼저 쓰므로 정답 쪽 클래스가 이긴다.
        compileClasspath += sourceSets.main.output
    }
    // 정답 테스트. 학습 테스트와 같은 라이브러리로 main(주어진 레거시 코드)을 대상으로 컴파일한다.
    // answer 출력은 넣지 않는다: 정답 테스트도 학습 테스트처럼 main 시그니처만 보고 컴파일돼야 한다.
    answerTest {
        java.srcDir 'src/answerTest/java'
        compileClasspath += sourceSets.main.output + configurations.testCompileClasspath
    }
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.14.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.assertj:assertj-core:3.27.7'
    // Gradle 9부터 JUnit Platform 런처를 직접 넣어야 한다.
    // J11MutantTest가 특성화 테스트를 Launcher API로 다시 실행하므로 컴파일 classpath에도 둔다
    testImplementation 'org.junit.platform:junit-platform-launcher'
}

// java-track 태스크를 직접 고른 실행인지 설정 단계에서 한 번만 계산한다.
// 루트 `./gradlew test`·`build`는 학습자 레거시 앱용이라 여기의 뼈대 실패가 섞이면 안 된다.
def requestedTaskNames = gradle.startParameter.taskNames
def javaTrackRequested = requestedTaskNames.any { it.startsWith(':java-track') || it.startsWith('java-track:') } ||
        gradle.startParameter.currentDir.canonicalFile == projectDir.canonicalFile

// 루트에서 태스크 이름만으로 실행하면(예: `./gradlew test`) 이 모듈의 태스크는 모두 건너뛴다.
// test만 막으면 컴파일은 여전히 돌아서, 학습자가 J 코드를 고치다 컴파일이 깨지면 루트 test까지 깨진다.
tasks.configureEach {
    onlyIf('java-track 태스크를 직접 골랐을 때만 실행한다') { javaTrackRequested }
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'failed', 'skipped'
        exceptionFormat = 'full'
    }
}

// 기본 완료 조건(`:java-track:test --tests 'J14*'`)에는 선택 과제를 넣지 않는다.
tasks.named('test', Test) {
    useJUnitPlatform {
        excludeTags 'optional'
    }
}

// 선택 과제만 따로 돌린다. 예: `./gradlew :java-track:optionalTest --tests 'J14*'`
tasks.register('optionalTest', Test) {
    description = '학습자 상태(main) 기준으로 @Tag("optional") 선택 과제만 실행한다.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'optional'
    }
}

// 매개변수 테스트의 기본 표시 이름은 "[1] null"뿐이라 XML testcase 이름에 메서드가 빠진다(같은 클래스의 두 메서드가
// 같은 이름이 된다). 전체 검증 두 태스크에서만 "메서드명(매개변수 타입) [1] null"로 바꿔 개별 테스트를 식별한다.
def fullRunDisplayName = ['junit.jupiter.params.displayname.default': '{displayName} [{index}] {argumentsWithNames}']

// answer 클래스를 main 클래스보다 앞에 둔다. 같은 이름의 클래스는 앞쪽이 로드되므로 정답이 뼈대를 가린다.
// 테스트 바이트코드는 main 시그니처로 컴파일됐으므로 정답 시그니처가 다르면 NoSuchMethodError로 드러난다.
// 정답 테스트(answerTest 소스 세트)는 그보다 더 앞에 둔다. 실행할 클래스 목록은 testClassesDirs(src/test)에서 정하고,
// 클래스는 이름으로 로드하므로 같은 이름의 학습자 자리(J11CharacterizationTest의 fail) 대신 정답 테스트가 돈다.
def answerTest = tasks.register('answerTest', Test) {
    description = '학습 테스트를 정답(answer) 클래스로 실행한다. 전부 통과해야 한다.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.answerTest.output + sourceSets.answer.output + sourceSets.test.runtimeClasspath
    systemProperties fullRunDisplayName
}

def skeletonResultsDir = layout.buildDirectory.dir('test-results/skeletonTest')

def skeletonTest = tasks.register('skeletonTest', Test) {
    description = '뼈대(main) 기준 학습 테스트를 실패 무시로 실행해 결과 XML을 남긴다.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    ignoreFailures = true
    reports.junitXml.outputLocation = skeletonResultsDir
    systemProperties fullRunDisplayName
    // verifySkeleton이 answerTest 결과와 비교하므로 answerTest를 먼저 돌린다
    mustRunAfter answerTest
    // 뼈대는 실패가 정상이므로 출력은 요약만 남긴다
    testLogging {
        events = []
        exceptionFormat = 'short'
    }
}

// 뼈대 실패로 인정하지 않는 실패: 클래스를 올리거나 초기화하다 깨진 것. 메시지에 뼈대 접두어가 섞여 있어도 뺀다
def notSkeletonFailureTypes = [
        'java.lang.ExceptionInInitializerError',
        'java.lang.NoClassDefFoundError',
        'java.lang.ClassNotFoundException',
        'java.lang.NoSuchMethodError',
        'java.lang.NoSuchFieldError',
        'java.lang.LinkageError',
        'java.lang.VerifyError',
] as Set
// 의도한 실패 ①: 단언이 틀렸다(AssertionError 계열). J11 학습자 자리의 fail(…)과 J12~J14 구조 단언이 여기에 든다.
// XML에는 상속 정보가 없어 이 테스트들이 쓰는 라이브러리의 AssertionError 하위 타입을 이름으로 적는다
def assertionFailureTypes = [
        'java.lang.AssertionError',
        'org.opentest4j.AssertionFailedError',
        'org.opentest4j.MultipleFailuresError',
        'org.assertj.core.error.AssertJMultipleFailuresError',
        'org.assertj.core.api.SoftAssertionError',
] as Set
// 의도한 실패 ②: 뼈대 메서드가 던진 UnsupportedOperationException("JNN: …" 또는 "JNN(선택): …").
// ExecutionException 등으로 감싸져도 메시지·스택("Caused by: …")에 남으므로 텍스트 전체에서 찾는다
def skeletonMarker = ~/UnsupportedOperationException: J\d\d(\([^)]*\))?:/
def testSourceDir = file('src/test/java')
def answerTestSourceDir = file('src/answerTest/java')

// 전체 검증 태스크에 걸린 필터. 하나라도 있으면 일부만 실행한 결과라 전체 검증으로 받지 않는다
def activeFilters = { Test task ->
    def found = []
    def filter = task.filter
    if (!filter.commandLineIncludePatterns.isEmpty()) found << "--tests ${filter.commandLineIncludePatterns}"
    if (!filter.includePatterns.isEmpty()) found << "filter include ${filter.includePatterns}"
    if (!filter.excludePatterns.isEmpty()) found << "filter exclude ${filter.excludePatterns}"
    if (!task.includes.isEmpty()) found << "파일 include ${task.includes}"
    if (!task.excludes.isEmpty()) found << "파일 exclude ${task.excludes}"
    def options = task.options
    if (options instanceof org.gradle.api.tasks.testing.junitplatform.JUnitPlatformOptions) {
        if (!options.includeTags.isEmpty()) found << "includeTags ${options.includeTags}"
        if (!options.excludeTags.isEmpty()) found << "excludeTags ${options.excludeTags}"
        if (!options.includeEngines.isEmpty()) found << "includeEngines ${options.includeEngines}"
        if (!options.excludeEngines.isEmpty()) found << "excludeEngines ${options.excludeEngines}"
    } else {
        found << "JUnit Platform이 아닌 테스트 프레임워크(${options.getClass().name})"
    }
    found
}

// 결과 XML을 읽어 최상위 클래스 이름 → testcase 목록으로 묶는다.
// testcase 식별자는 "classname#name"(매개변수 케이스는 fullRunDisplayName 덕에 메서드 이름이 들어 있다)
def readResults = { File dir ->
    def byClass = [:].withDefault { [] }
    if (!dir.isDirectory()) {
        return byClass
    }
    dir.eachFileMatch(~/TEST-.*\.xml/) { file ->
        def suite = new groovy.xml.XmlSlurper().parse(file)
        def simpleName = suite.@name.toString().tokenize('.').last().tokenize('$').first()
        if (!(simpleName ==~ /J\d\d.*/)) {
            return
        }
        suite.testcase.each { testcase ->
            byClass[simpleName] << [
                    id      : "${testcase.@classname}#${testcase.@name}".toString(),
                    skipped : testcase.skipped.size() > 0,
                    problems: (testcase.failure.list() + testcase.error.list()).collect { problem ->
                        [type: problem.@type.toString(), text: problem.@message.toString() + '\n' + problem.text()]
                    },
            ]
        }
    }
    byClass
}

// 실패 하나가 "뼈대가 미구현이라 난 실패"인지. 준비 단계 오류(@BeforeEach의 IllegalStateException 등)는 아니다
def intendedKind = { Map problem ->
    if (notSkeletonFailureTypes.contains(problem.type)) {
        return null
    }
    if (problem.text =~ skeletonMarker) {
        return 'JNN 뼈대 예외'
    }
    assertionFailureTypes.contains(problem.type) ? 'AssertionError 계열' : null
}

def verifySkeleton = tasks.register('verifySkeleton') {
    description = 'answerTest(전체 통과)와 같은 개별 테스트가 뼈대 기준으로 모두 실행됐고, 실패는 전부 의도한 뼈대 실패이며, 클래스마다 1개 이상인지 확인한다(뼈대가 실수로 정답이 되지 않게).'
    group = 'verification'
    dependsOn answerTest, skeletonTest
    inputs.dir(testSourceDir)
    doLast {
        def problems = []

        // 1) 필터를 건 결과는 전체 검증이 아니다(include·exclude·파일 패턴·태그·엔진)
        [answerTest.get(), skeletonTest.get()].each { task ->
            def filters = activeFilters(task)
            if (!filters.isEmpty()) {
                problems << "${task.name}에 테스트 필터가 걸려 있습니다(${filters.join('; ')}). 필터 없이 `:java-track:check`로 실행하세요."
            }
        }
        if (!problems.isEmpty()) {
            throw new GradleException('verifySkeleton:\n  - ' + problems.join('\n  - '))
        }

        // 2) 기대 클래스 집합: src/test 안의 JNN…Test.java 파일 이름
        def classNamesIn = { File dir ->
            def names = [] as SortedSet
            if (dir.isDirectory()) {
                dir.eachFileRecurse(groovy.io.FileType.FILES) { file ->
                    def m = file.name =~ /^(J\d\d\w*Test)\.java$/
                    if (m.matches()) {
                        names << m.group(1)
                    }
                }
            }
            names
        }
        def expected = classNamesIn(testSourceDir)
        if (expected.isEmpty()) {
            throw new GradleException('verifySkeleton: src/test에 J로 시작하는 테스트 클래스가 없습니다.')
        }
        // answerTest에서 정답 테스트(src/answerTest)가 가리는 클래스는 실행하는 테스트 자체가 달라 식별자를 비교하지 않는다
        def shadowed = classNamesIn(answerTestSourceDir)

        def answer = readResults(answerTest.get().reports.junitXml.outputLocation.get().asFile)
        def skeleton = readResults(skeletonResultsDir.get().asFile)

        // 3) 클래스 집합
        [answerTest: answer, skeletonTest: skeleton].each { taskName, results ->
            def missing = expected - results.keySet()
            if (!missing.isEmpty()) {
                problems << "${taskName} 결과가 없는 클래스(전체 실행이 아니거나 클래스가 올라가지 않음): ${missing.join(', ')}"
            }
            def unexpected = results.keySet() - expected
            if (!unexpected.isEmpty()) {
                problems << "${taskName}: src/test에 없는 클래스의 결과(오래된 결과일 수 있음): ${unexpected.sort().join(', ')}"
            }
            def empty = expected.findAll { results.containsKey(it) && results[it].every { it.skipped } }
            if (!empty.isEmpty()) {
                problems << "${taskName}: 실행한 테스트가 없는 클래스: ${empty.join(', ')}"
            }
            def skippedCases = results.values().flatten().findAll { it.skipped }*.id
            if (!skippedCases.isEmpty()) {
                problems << "${taskName}: 건너뛴 테스트: ${skippedCases.join(', ')}"
            }
        }
        def answerFailures = answer.values().flatten().findAll { !it.problems.isEmpty() }*.id
        if (!answerFailures.isEmpty()) {
            problems << "answerTest에서 실패한 테스트: ${answerFailures.join(', ')}"
        }

        // 4) 개별 테스트 식별자: answerTest와 skeletonTest가 같은 테스트를 같은 횟수만큼 실행했는지(중복 이름도 횟수로 센다)
        (expected - shadowed).findAll { answer.containsKey(it) && skeleton.containsKey(it) }.each { className ->
            def answerIds = answer[className]*.id.countBy { it }
            def skeletonIds = skeleton[className]*.id.countBy { it }
            if (answerIds != skeletonIds) {
                def onlyAnswer = answerIds.findAll { id, n -> skeletonIds.getOrDefault(id, 0) < n }.collect { id, n -> "${id} ×${n - skeletonIds.getOrDefault(id, 0)}" }
                def onlySkeleton = skeletonIds.findAll { id, n -> answerIds.getOrDefault(id, 0) < n }.collect { id, n -> "${id} ×${n - answerIds.getOrDefault(id, 0)}" }
                problems << "${className}: answerTest와 skeletonTest의 개별 테스트가 다릅니다" +
                        (onlyAnswer ? " / skeletonTest에 없는 것: ${onlyAnswer.join(', ')}" : '') +
                        (onlySkeleton ? " / answerTest에 없는 것: ${onlySkeleton.join(', ')}" : '')
            }
        }

        // 5) 뼈대 실패 원인: 실패는 전부 의도한 실패여야 하고, 클래스마다 1개 이상이어야 한다
        def intendedByClass = [:].withDefault { 0 }
        def intendedByKind = [:].withDefault { 0 }
        def unintended = []
        skeleton.each { className, cases ->
            cases.findAll { !it.problems.isEmpty() }.each { testcase ->
                def kinds = testcase.problems.collect { intendedKind(it) }
                if (kinds.every { it != null }) {
                    intendedByClass[className] += 1
                    intendedByKind[kinds.first()] += 1
                } else {
                    unintended << "${testcase.id}: ${testcase.problems*.type.join(', ')}"
                }
            }
        }
        if (!unintended.isEmpty()) {
            problems << "뼈대 미구현(UnsupportedOperationException(\"JNN: …\"))도 단언 실패(AssertionError 계열)도 아닌 실패(준비 단계 오류일 수 있음):\n      " + unintended.join('\n      ')
        }
        def passedOnSkeleton = expected.findAll { skeleton.containsKey(it) && intendedByClass[it] == 0 }
        if (!passedOnSkeleton.isEmpty()) {
            problems << "뼈대 상태에서 의도한 실패가 하나도 없는 클래스(뼈대가 정답이 됨): ${passedOnSkeleton.join(', ')}"
        }

        if (!problems.isEmpty()) {
            throw new GradleException('verifySkeleton:\n  - ' + problems.join('\n  - '))
        }
        def total = skeleton.values().flatten().size()
        def totalIntended = intendedByClass.values().sum()
        logger.lifecycle("verifySkeleton: J 테스트 클래스 ${expected.size()}개, 개별 테스트 ${total}개가 answerTest와 같게 뼈대 기준으로 실행됐고" +
                "(정답 테스트로 바뀌는 ${shadowed.join(', ')}는 클래스 단위로만 비교), 클래스마다 의도한 실패가 있음" +
                "(의도한 실패 ${totalIntended}건: ${intendedByKind.collect { k, v -> "${k} ${v}" }.join(', ')})")
    }
}

// java 플러그인이 기본으로 거는 check → test 의존을 걷어 낸다(뼈대 상태의 test는 실패가 정상).
tasks.named('check') {
    setDependsOn([answerTest, verifySkeleton])
}
