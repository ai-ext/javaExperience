<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img"><title>P16 invalid-quantity</title><desc>Exact values from source P16 section 3.2. This is a lesson asset, not a screenshot or live execution.</desc><rect width="1200" height="650" fill="#ffffff"/><text x="30" y="49" font-family="Arial, sans-serif" font-size="28" fill="#18243a" font-weight="700">Input comparison   quantity: 2  to  quantity: &quot;two&quot;</text><rect x="30" y="92" width="540" height="320" rx="12" fill="#fff" stroke="#d9e1eb"/><text x="58" y="133" font-family="Arial, sans-serif" font-size="24" fill="#18243a" font-weight="700">POST /orders</text><text x="58" y="166" font-family="Arial, sans-serif" font-size="16" fill="#62738c" font-weight="400">Only quantity changed; product is still &quot;keyboard&quot;</text><line x1="58" y1="234" x2="542" y2="234" stroke="#edf1f7"/><text x="58" y="217" font-family="DejaVu Sans Mono, monospace" font-size="20" fill="#18243a" font-weight="400">product</text><text x="212" y="217" font-family="DejaVu Sans Mono, monospace" font-size="16" fill="#62738c" font-weight="400">string</text><text x="298" y="217" font-family="DejaVu Sans Mono, monospace" font-size="18" fill="#2457e8" font-weight="700">&quot;keyboard&quot;</text><line x1="58" y1="286" x2="542" y2="286" stroke="#edf1f7"/><text x="58" y="269" font-family="DejaVu Sans Mono, monospace" font-size="20" fill="#18243a" font-weight="400">quantity</text><text x="212" y="269" font-family="DejaVu Sans Mono, monospace" font-size="16" fill="#62738c" font-weight="400">string</text><text x="298" y="269" font-family="DejaVu Sans Mono, monospace" font-size="18" fill="#2457e8" font-weight="700">&quot;two&quot;</text><rect x="630" y="92" width="540" height="320" rx="12" fill="#fff8f2" stroke="#e5c9af"/><text x="658" y="133" font-family="Arial, sans-serif" font-size="24" fill="#18243a" font-weight="700">400  Expected response</text><text x="658" y="186" font-family="DejaVu Sans Mono, monospace" font-size="20" fill="#18243a" font-weight="400">HttpMessageNotReadableException</text><text x="658" y="241" font-family="Arial, sans-serif" font-size="18" fill="#18243a" font-weight="400">The string &quot;two&quot; cannot be read as int quantity.</text><text x="658" y="288" font-family="Arial, sans-serif" font-size="20" fill="#18243a" font-weight="700">Controller body: not reached</text><text x="658" y="334" font-family="Arial, sans-serif" font-size="20" fill="#18243a" font-weight="700">OrderResponse: not created</text><rect x="30" y="440" width="1140" height="135" rx="12" fill="#f3f6fc" stroke="#d9e1eb"/><text x="54" y="470" font-family="Arial, sans-serif" font-size="16" fill="#62738c" font-weight="400">Failure point: request body conversion, before method invocation</text><text x="54" y="507" font-family="DejaVu Sans Mono, monospace" font-size="18" fill="#18243a" font-weight="400">@RequestBody CreateOrderRequest request</text><text x="30" y="613" font-family="Arial, sans-serif" font-size="17" fill="#62738c" font-weight="400">Source P16 states the status and exception. No error-response JSON body is invented.</text></svg>