<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img"><title>P16 response-object</title><desc>Exact values from source P16 section 3.2. This is a lesson asset, not a screenshot or live execution.</desc><rect width="1200" height="650" fill="#ffffff"/><text x="30" y="49" font-family="Arial, sans-serif" font-size="28" fill="#18243a" font-weight="700">02   Read the request; create a separate response object</text><rect x="30" y="92" width="540" height="320" rx="12" fill="#fff" stroke="#d9e1eb"/><text x="58" y="133" font-family="Arial, sans-serif" font-size="24" fill="#18243a" font-weight="700">CreateOrderRequest</text><text x="58" y="166" font-family="Arial, sans-serif" font-size="16" fill="#62738c" font-weight="400">The request object remains a separate object</text><line x1="58" y1="234" x2="542" y2="234" stroke="#edf1f7"/><text x="58" y="217" font-family="DejaVu Sans Mono, monospace" font-size="20" fill="#18243a" font-weight="400">product</text><text x="212" y="217" font-family="DejaVu Sans Mono, monospace" font-size="16" fill="#62738c" font-weight="400">String</text><text x="298" y="217" font-family="DejaVu Sans Mono, monospace" font-size="18" fill="#2457e8" font-weight="700">&quot;keyboard&quot;</text><line x1="58" y1="286" x2="542" y2="286" stroke="#edf1f7"/><text x="58" y="269" font-family="DejaVu Sans Mono, monospace" font-size="20" fill="#18243a" font-weight="400">quantity</text><text x="212" y="269" font-family="DejaVu Sans Mono, monospace" font-size="16" fill="#62738c" font-weight="400">int</text><text x="298" y="269" font-family="DejaVu Sans Mono, monospace" font-size="18" fill="#2457e8" font-weight="700">2</text><rect x="630" y="92" width="540" height="320" rx="12" fill="#fff" stroke="#d9e1eb"/><text x="658" y="133" font-family="Arial, sans-serif" font-size="24" fill="#18243a" font-weight="700">OrderResponse</text><text x="658" y="166" font-family="Arial, sans-serif" font-size="16" fill="#62738c" font-weight="400">id and createdAt are fixed literals in this example</text><line x1="658" y1="234" x2="1142" y2="234" stroke="#edf1f7"/><text x="658" y="217" font-family="DejaVu Sans Mono, monospace" font-size="20" fill="#18243a" font-weight="400">id</text><text x="812" y="217" font-family="DejaVu Sans Mono, monospace" font-size="16" fill="#62738c" font-weight="400">long</text><text x="898" y="217" font-family="DejaVu Sans Mono, monospace" font-size="18" fill="#2457e8" font-weight="700">1</text><line x1="658" y1="286" x2="1142" y2="286" stroke="#edf1f7"/><text x="658" y="269" font-family="DejaVu Sans Mono, monospace" font-size="20" fill="#18243a" font-weight="400">product</text><text x="812" y="269" font-family="DejaVu Sans Mono, monospace" font-size="16" fill="#62738c" font-weight="400">String</text><text x="898" y="269" font-family="DejaVu Sans Mono, monospace" font-size="18" fill="#2457e8" font-weight="700">&quot;keyboard&quot;</text><line x1="658" y1="338" x2="1142" y2="338" stroke="#edf1f7"/><text x="658" y="321" font-family="DejaVu Sans Mono, monospace" font-size="20" fill="#18243a" font-weight="400">quantity</text><text x="812" y="321" font-family="DejaVu Sans Mono, monospace" font-size="16" fill="#62738c" font-weight="400">int</text><text x="898" y="321" font-family="DejaVu Sans Mono, monospace" font-size="18" fill="#2457e8" font-weight="700">2</text><line x1="658" y1="390" x2="1142" y2="390" stroke="#edf1f7"/><text x="658" y="373" font-family="DejaVu Sans Mono, monospace" font-size="20" fill="#18243a" font-weight="400">createdAt</text><text x="812" y="373" font-family="DejaVu Sans Mono, monospace" font-size="16" fill="#62738c" font-weight="400">Instant</text><text x="898" y="373" font-family="DejaVu Sans Mono, monospace" font-size="18" fill="#2457e8" font-weight="700">2026-09-29T00:00:00Z</text><rect x="30" y="440" width="1140" height="135" rx="12" fill="#f3f6fc" stroke="#d9e1eb"/><text x="54" y="470" font-family="Arial, sans-serif" font-size="16" fill="#62738c" font-weight="400">Code focus: constructing the response object</text><text x="54" y="507" font-family="DejaVu Sans Mono, monospace" font-size="18" fill="#18243a" font-weight="400">return new OrderResponse(1L, request.product(), request.quantity(),</text><text x="54" y="534" font-family="DejaVu Sans Mono, monospace" font-size="18" fill="#18243a" font-weight="400">    Instant.parse(&quot;2026-09-29T00:00:00Z&quot;));</text><text x="30" y="613" font-family="Arial, sans-serif" font-size="17" fill="#62738c" font-weight="400">createdAt = 2026-09-29T00:00:00Z. new creates a Java object; this example does not use a DB.</text></svg>