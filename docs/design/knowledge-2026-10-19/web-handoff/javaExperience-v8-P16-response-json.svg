<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img"><title>P16 response-json</title><desc>Exact values from source P16 section 3.2. This is a lesson asset, not a screenshot or live execution.</desc><rect width="1200" height="650" fill="#ffffff"/><text x="30" y="49" font-family="Arial, sans-serif" font-size="28" fill="#18243a" font-weight="700">03   Serialize the response object as JSON</text><rect x="30" y="92" width="540" height="320" rx="12" fill="#fff" stroke="#d9e1eb"/><text x="58" y="133" font-family="Arial, sans-serif" font-size="24" fill="#18243a" font-weight="700">OrderResponse</text><text x="58" y="166" font-family="Arial, sans-serif" font-size="16" fill="#62738c" font-weight="400">Returned by the @RestController method</text><line x1="58" y1="234" x2="542" y2="234" stroke="#edf1f7"/><text x="58" y="217" font-family="DejaVu Sans Mono, monospace" font-size="20" fill="#18243a" font-weight="400">id</text><text x="212" y="217" font-family="DejaVu Sans Mono, monospace" font-size="16" fill="#62738c" font-weight="400">long</text><text x="298" y="217" font-family="DejaVu Sans Mono, monospace" font-size="18" fill="#2457e8" font-weight="700">1</text><line x1="58" y1="286" x2="542" y2="286" stroke="#edf1f7"/><text x="58" y="269" font-family="DejaVu Sans Mono, monospace" font-size="20" fill="#18243a" font-weight="400">product</text><text x="212" y="269" font-family="DejaVu Sans Mono, monospace" font-size="16" fill="#62738c" font-weight="400">String</text><text x="298" y="269" font-family="DejaVu Sans Mono, monospace" font-size="18" fill="#2457e8" font-weight="700">&quot;keyboard&quot;</text><line x1="58" y1="338" x2="542" y2="338" stroke="#edf1f7"/><text x="58" y="321" font-family="DejaVu Sans Mono, monospace" font-size="20" fill="#18243a" font-weight="400">quantity</text><text x="212" y="321" font-family="DejaVu Sans Mono, monospace" font-size="16" fill="#62738c" font-weight="400">int</text><text x="298" y="321" font-family="DejaVu Sans Mono, monospace" font-size="18" fill="#2457e8" font-weight="700">2</text><line x1="58" y1="390" x2="542" y2="390" stroke="#edf1f7"/><text x="58" y="373" font-family="DejaVu Sans Mono, monospace" font-size="20" fill="#18243a" font-weight="400">createdAt</text><text x="212" y="373" font-family="DejaVu Sans Mono, monospace" font-size="16" fill="#62738c" font-weight="400">Instant</text><text x="298" y="373" font-family="DejaVu Sans Mono, monospace" font-size="18" fill="#2457e8" font-weight="700">2026-09-29T00:00:00Z</text><rect x="630" y="92" width="540" height="320" rx="12" fill="#fff" stroke="#d9e1eb"/><text x="658" y="133" font-family="Arial, sans-serif" font-size="24" fill="#18243a" font-weight="700">200  Expected response</text><text x="658" y="166" font-family="Arial, sans-serif" font-size="15" fill="#62738c" font-weight="400">Original example, not a response observed from your server</text><text x="658" y="215" font-family="DejaVu Sans Mono, monospace" font-size="18" fill="#18243a" font-weight="400">{</text><text x="658" y="247" font-family="DejaVu Sans Mono, monospace" font-size="18" fill="#2457e8" font-weight="400">  &quot;id&quot;: 1,</text><text x="658" y="279" font-family="DejaVu Sans Mono, monospace" font-size="18" fill="#2457e8" font-weight="400">  &quot;product&quot;: &quot;keyboard&quot;,</text><text x="658" y="311" font-family="DejaVu Sans Mono, monospace" font-size="18" fill="#2457e8" font-weight="400">  &quot;quantity&quot;: 2,</text><text x="658" y="343" font-family="DejaVu Sans Mono, monospace" font-size="18" fill="#2457e8" font-weight="400">  &quot;createdAt&quot;: &quot;2026-09-29T00:00:00Z&quot;</text><text x="658" y="375" font-family="DejaVu Sans Mono, monospace" font-size="18" fill="#2457e8" font-weight="400">}</text><rect x="30" y="440" width="1140" height="135" rx="12" fill="#f3f6fc" stroke="#d9e1eb"/><text x="54" y="470" font-family="Arial, sans-serif" font-size="16" fill="#62738c" font-weight="400">Framework phase: after the controller returns</text><text x="54" y="507" font-family="DejaVu Sans Mono, monospace" font-size="18" fill="#18243a" font-weight="400">@RestController  -&gt;  response body via HttpMessageConverter</text><text x="30" y="613" font-family="Arial, sans-serif" font-size="17" fill="#62738c" font-weight="400">Compare field names, types and values. JSON whitespace and field order are not a result mismatch.</text></svg>