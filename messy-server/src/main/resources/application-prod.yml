# 기본값 없는 자리표시자만 둔다. 비밀값(DB 비밀번호·JWT·PG 키)이 비면 ProdSecretsCheck가 기동을 멈춘다.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
board:
  jwt:
    secret: ${BOARD_JWT_SECRET}
    # 2026-10 보안 점검 지적: 운영 토큰 만료는 30분(기본 1시간)
    expires-in-seconds: 1800
  pg:
    base-url: ${BOARD_PG_BASE_URL}
    secret: ${BOARD_PG_SECRET}
management:
  endpoints:
    web:
      exposure:
        # 운영 점검용. 설정 확인(env)과 지표(metrics)를 연다
        include: health,info,metrics,env
  endpoint:
    env:
      # 기본값(never)은 값이 전부 ******라 운영 설정을 확인할 수 없다
      show-values: always
