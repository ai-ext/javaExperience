spring:
  application:
    name: board-server
  datasource:
    hikari:
      # spec-v2 §8 운영 값. 풀이 바닥나면 2초 안에 실패시켜 요청 스레드가 끝없이 기다리지 않게 한다.
      maximum-pool-size: 10
      connection-timeout: 2000
  data:
    redis:
      # compose의 Redis(16380). 운영은 환경 변수로 덮는다.
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:16380}
      # 붙지 못하는 경우만 빨리 알아차리면 된다. 명령 응답은 따로 끊지 않는다(랭킹 재계산 같은 큰 명령이 중간에 끊기면 안 되므로 클라이언트 기본값).
      connect-timeout: 500ms
  servlet:
    multipart:
      # spec-v2 5-6 쿠폰 대량 지급 파일 한도. 넘으면 400(GlobalExceptionHandler).
      # 요청 전체 한도를 파일 한도와 같게 두면 Content-Length만 보고 본문을 읽지 않은 채 거절해
      # 톰캣이 연결을 끊고(아래 max-swallow-size) 클라이언트는 400 대신 연결 오류를 받는다.
      max-file-size: 5MB
      max-request-size: 10MB
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      # 커밋하자마자 DB 커넥션을 풀에 돌려준다. 기본값(HOLD)은 커밋 뒤 리스너(AFTER_COMMIT)가 끝날 때까지 쥐고 있어
      # 리스너의 Redis 호출이 느리면 그만큼 Hikari 풀(10)을 잡는다.
      hibernate.connection.handling_mode: DELAYED_ACQUISITION_AND_RELEASE_AFTER_TRANSACTION
  sql:
    init:
      # MySQL 같은 외부 DB는 always가 아니면 schema.sql을 실행하지 않는다
      mode: always

server:
  tomcat:
    # 거절한 요청의 남은 본문을 이만큼까지 읽어 버리고 연결을 살린다(기본 2MB). 넘으면 응답 뒤 연결을 끊는다.
    max-swallow-size: 10MB

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

board:
  forbidden-words:
    ignore-case: true
  jwt:
    expires-in-seconds: 3600
  pg:
    # compose의 Toxiproxy(→ WireMock). 운영은 환경 변수로 덮는다.
    base-url: ${BOARD_PG_BASE_URL:http://localhost:18667}
    # spec-v2 §8 운영 값
    connect-timeout: 1s
    response-timeout: 3s
    connection-request-timeout: 2s
    max-connections: 20

management:
  endpoints:
    web:
      exposure:
        # HTTP로는 health만 노출한다 (env 등은 비밀값이 드러난다)
        include: health
  health:
    redis:
      # Redis는 캐시·거름망이라 없어도 DB로 폴백해 동작한다. 켜 두면 Redis 장애만으로 헬스가 503이 되어
      # 로드밸런서가 멀쩡한 서버까지 빼 버린다. Redis 상태는 헬스가 아니라 경고 로그·지표로 본다.
      enabled: false

---
spring:
  config:
    activate:
      on-profile: test
  jpa:
    properties:
      # 테스트에서 SQL 실행 횟수(N+1)를 세기 위해서만 켠다
      hibernate.generate_statistics: true
board:
  jwt:
    secret: ${BOARD_JWT_SECRET:test-only-secret-test-only-secret-0123}
  pg:
    secret: ${BOARD_PG_SECRET:test-only-pg-secret-test-only-pg-secret}
