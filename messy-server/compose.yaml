services:
  mysql:
    image: mysql:8.4
    ports:
      - "13311:3306"
    environment:
      MYSQL_DATABASE: board
      MYSQL_USER: board
      MYSQL_PASSWORD: ${DB_PASSWORD:-board}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      retries: 20

  # 인기글 캐시·쿠폰 수량·랭킹·로그인 제한. 서버는 localhost:16380로 붙는다.
  redis:
    image: redis:7.4
    ports:
      - "16380:6379"

  # PG 모의. 스텁은 테스트와 같은 디렉터리를 쓴다(금액 999000은 항상 거절).
  wiremock:
    image: wiremock/wiremock:3.13.1
    ports:
      - "18081:8080"
    volumes:
      - ./src/test/resources/wiremock:/home/wiremock:ro

  # 서버는 Toxiproxy(18667)를 거쳐 WireMock을 부른다. 지연 주입 예:
  # curl -X POST localhost:8475/proxies/pg/toxics -d '{"type":"latency","attributes":{"latency":5000}}'
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    command: ["-host=0.0.0.0", "-config=/config/toxiproxy.json"]
    ports:
      - "8475:8474"
      - "18667:8666"
    volumes:
      - ./toxiproxy.json:/config/toxiproxy.json:ro
    depends_on:
      - wiremock
